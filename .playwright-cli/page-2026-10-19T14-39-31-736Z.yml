              - definition [ref=f8e179]: 5x114.3
              - term [ref=f8e180]: Центральное отверстие
              - definition [ref=f8e181]: 60.1 мм
              - term [ref=f8e182]: Кольца
              - definition [ref=f8e183]: Неоригинальные диски с ЦО 64.1/66.1/67.1/73.1 - ставить центровочные кольца на 60.1, иначе биение на скорости.
              - term [ref=f8e184]: Гайки
              - definition [ref=f8e185]: Гайка M12x1.5, конус 60°, под ключ 21 мм, 5 шт на колесо
              - term [ref=f8e186]: Момент затяжки
              - definition [ref=f8e187]: 103 Н·м
              - term [ref=f8e188]: Диаметры
              - definition [ref=f8e189]: R15-R17 штатно; R18 возможно (7-7.5J ET40-45, 215/40 или 225/40), но жёстче, риск задевания и повреждения дисков; R14 не встаёт из-за суппорта 275 мм.
              - term [ref=f8e190]: Ширина
              - definition [ref=f8e191]: 6-7.5J. 6-7J без вопросов, 7.5J - только с ET 40-45 и шиной не шире 225.
              - term [ref=f8e192]: Вылет ET
              - definition [ref=f8e193]: Штатно ET39-45, допустимо ET35-50. Ниже ET35 при 7-7.5J колесо выходит за арку, задевает кромку крыла на ходе сжатия с пассажирами; выше ET50 при 7.5J риск касания шины о стойку/пружину.
              - term [ref=f8e194]: Задевания
              - definition [ref=f8e195]: "Самые рискованные: 225/45R17 на 7.5J ET35 и 225/40R18 на 8J. Проверять полный поворот руля и сжатие подвески. Проставки - только с длинными шпильками или болтовые хабцентричные."
