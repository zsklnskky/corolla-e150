            - paragraph [ref=f8e396]: "Запаска: Под полом багажника: полноразмерное стальное 15 или докатка T125/70D16 (T-тип, до 80 км/ч), зависит от комплектации и рынка. Проверить у своей машины."
            - paragraph [ref=f8e397]: "Беларусь: с 1 декабря по 1 марта легковые и грузовые до 3.5 т обязаны ехать на зимних шинах на всех колёсах (п. 207-1 ПДД РБ), маркировка 3PMSF (гора со снежинкой) или M+S/M&S/All seasons, протектор не менее 4 мм. Штраф: за летнюю резину - предупреждение или 0.5 базовой, за износ - до 1 базовой (суммы по новостям, сверить с КоАП). Шипы: в РБ отдельного сезонного запрета и обязательного знака \"Ш\" в найденных источниках нет - не подтверждено. Россия: зимние с декабря по февраль, шипы запрещены в июне-августе (ТР ТС 018/2011), знак \"Ш\" рекомендован. Шиповать на все 4 колеса одинаково."
